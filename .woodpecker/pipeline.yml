when:
  # Push pipelines only for main. A branch with a PR already gets the
  # pull_request pipeline; a second pipeline per push doubled the queue,
  # and Renovate PRs waited so long that the clone token expired
  # ("could not read Username").
  #
  # The CI_FORGE_URL guard stays even though there is no Codeberg pipeline
  # any more: Woodpecker reads every file under .woodpecker/, so if a
  # Codeberg-backed instance is ever pointed at this repo again it would pick
  # this file up and publish everything twice.
  - event: pull_request
    evaluate: 'not (CI_FORGE_URL contains "codeberg.org")'
  - event: push
    branch: main
    evaluate: 'not (CI_FORGE_URL contains "codeberg.org")'
  - event: [tag, manual]
    evaluate: 'not (CI_FORGE_URL contains "codeberg.org")'

steps:
  # golangci-lint, gosec and govulncheck come from one image with pinned versions
  # (git.infra-heroes.de/infraheroes/ci-go, built in the ci-images repository), not from
  # copies of the install commands in every repository.
  lint:
    image: git.infra-heroes.de/infraheroes/ci-go:1
    commands:
      - golangci-lint run --verbose --timeout 10m

  security:
    image: git.infra-heroes.de/infraheroes/ci-go:1
    commands:
      - gosec ./...

  vulncheck:
    image: git.infra-heroes.de/infraheroes/ci-go:1
    commands:
      - govulncheck ./...

  test:
    image: golang:1.27-alpine
    commands:
      - apk add --no-cache git build-base
      - go test -v ./...

  build:
    image: golang:1.27-alpine
    environment:
      CLIENT_ID:
        from_secret: client_id
    commands:
      - apk add --no-cache git
      # A release binary with no client id cannot start the device flow, so it
      # cannot log in to anything - and the build succeeds regardless, because
      # an empty -X value is a perfectly good empty string. internal/build says
      # the defaults are empty "so that a misconfigured build fails loudly";
      # this is where it gets to.
      - |
        if [ "${CI_PIPELINE_EVENT}" = "tag" ] && [ -z "$${CLIENT_ID}" ]; then
          echo "CLIENT_ID is not set: a released binary would be unable to sign in." >&2
          exit 1
        fi
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/Infra-Heroes/heroctl/internal/build.ServerURL=https://api.infra-heroes.de -X github.com/Infra-Heroes/heroctl/internal/build.AuthDomain=auth.infra-heroes.de -X github.com/Infra-Heroes/heroctl/internal/build.ClientID=$${CLIENT_ID} -X github.com/Infra-Heroes/heroctl/internal/build.Version=${CI_COMMIT_TAG:-dev}" -o heroctl ./cmd/heroctl
      - |
        if [ "${CI_PIPELINE_EVENT}" = "tag" ] || [ "${CI_PIPELINE_EVENT}" = "manual" ]; then
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              # Windows is built for x86-64 only: there is no Windows-on-ARM user base
              # worth a sixth file in every release (and in the Codeberg quota).
              if [ "$os" = "windows" ] && [ "$arch" = "arm64" ]; then
                continue
              fi
              ext=""
              if [ "$os" = "windows" ]; then
                ext=".exe"
              fi
              echo "Building heroctl-$os-$arch$ext..."
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X github.com/Infra-Heroes/heroctl/internal/build.ServerURL=https://api.infra-heroes.de -X github.com/Infra-Heroes/heroctl/internal/build.AuthDomain=auth.infra-heroes.de -X github.com/Infra-Heroes/heroctl/internal/build.ClientID=$${CLIENT_ID} -X github.com/Infra-Heroes/heroctl/internal/build.Version=${CI_COMMIT_TAG:-dev}" -o dist/heroctl-$os-$arch$ext ./cmd/heroctl
            done
          done
        fi

  release:
    image: woodpeckerci/plugin-gitea-release
    when:
      event: tag
      ref: refs/tags/v*
    settings:
      api_key:
        from_secret: gitea_token
      base_url: https://git.infra-heroes.de
      files:
        - dist/*
      title: ${CI_COMMIT_TAG}
      generate_release_notes: true

  docker-gitea:
    image: woodpeckerci/plugin-docker-buildx:6.1.2
    privileged: true
    when:
      - event: tag
        ref: refs/tags/v*
      - event: push
        branch: main
    settings:
      registry: git.infra-heroes.de
      repo: git.infra-heroes.de/infraheroes/heroctl
      username:
        from_secret: gitea_user
      password:
        from_secret: gitea_token
      platforms: linux/amd64,linux/arm64
      tags:
        - ${CI_COMMIT_TAG:-latest}
      build_args:
        - SERVER_URL=https://api.infra-heroes.de
        - AUTH_DOMAIN=auth.infra-heroes.de
      build_args_from_env:
        - CLIENT_ID=client_id
