when:
  event: [push, pull_request, tag, manual]

steps:
  # Both of these failed on every run since the first pipeline and nobody
  # saw it: `failure: ignore` kept the build green. lint never even ran - the
  # image has no curl, so golangci-lint was never installed. They gate again.
  lint:
    image: golang:1.26-alpine
    commands:
      - apk add --no-cache git build-base curl
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b /usr/local/bin v2.12.2
      - golangci-lint run --verbose --timeout 5m

  security:
    image: securego/gosec:2.24.6
    environment:
      GOTOOLCHAIN: auto
    commands:
      - apk add --no-cache git
      - gosec ./...

  test:
    image: golang:1.26-alpine
    commands:
      - apk add --no-cache git build-base
      - go test -v ./...

  build:
    image: golang:1.26-alpine
    environment:
      CLIENT_ID:
        from_secret: client_id
    commands:
      - apk add --no-cache git
      # A release binary with no client id cannot start the device flow, so it
      # cannot log in to anything - and the build succeeds regardless, because
      # an empty -X value is a perfectly good empty string. internal/build says
      # the defaults are empty "so that a misconfigured build fails loudly";
      # this is where it gets to.
      - |
        if [ "${CI_PIPELINE_EVENT}" = "tag" ] && [ -z "$${CLIENT_ID}" ]; then
          echo "CLIENT_ID is not set: a released binary would be unable to sign in." >&2
          exit 1
        fi
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/Infra-Heroes/heroctl/internal/build.ServerURL=https://api.infra-heroes.de -X github.com/Infra-Heroes/heroctl/internal/build.AuthDomain=auth.infra-heroes.de -X github.com/Infra-Heroes/heroctl/internal/build.ClientID=$${CLIENT_ID} -X github.com/Infra-Heroes/heroctl/internal/build.Version=${CI_COMMIT_TAG:-dev}" -o heroctl ./cmd/heroctl
      - |
        if [ "${CI_PIPELINE_EVENT}" = "tag" ] || [ "${CI_PIPELINE_EVENT}" = "manual" ]; then
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              if [ "$os" = "windows" ]; then
                ext=".exe"
              fi
              echo "Building heroctl-$os-$arch$ext..."
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X github.com/Infra-Heroes/heroctl/internal/build.ServerURL=https://api.infra-heroes.de -X github.com/Infra-Heroes/heroctl/internal/build.AuthDomain=auth.infra-heroes.de -X github.com/Infra-Heroes/heroctl/internal/build.ClientID=$${CLIENT_ID} -X github.com/Infra-Heroes/heroctl/internal/build.Version=${CI_COMMIT_TAG:-dev}" -o dist/heroctl-$os-$arch$ext ./cmd/heroctl
            done
          done
        fi

  # Publishes to Forgejo, where this repository actually lives.
  #
  # It still pointed at codeberg.org - api_key, base_url and all - months after
  # the move, and `failure: ignore` meant every tagged build reported green
  # while publishing nothing. The repository has no releases at all, so
  # customers have no binaries: the one thing this pipeline exists to produce.
  #
  # The ignore is gone with it. A release step whose failure is ignored is a
  # release step nobody finds out about.
  release:
    image: woodpeckerci/plugin-gitea-release
    when:
      event: tag
      ref: refs/tags/v*
    settings:
      api_key:
        from_secret: gitea_token
      base_url: https://git.infra-heroes.de
      files:
        - dist/*
      title: ${CI_COMMIT_TAG}
      generate_release_notes: true

  docker:
    image: woodpeckerci/plugin-docker-buildx:6.1.0
    privileged: true
    when:
      - event: tag
        ref: refs/tags/v*
      - event: push
        branch: main
    settings:
      registry: git.infra-heroes.de
      repo: git.infra-heroes.de/infraheroes/heroctl
      # The Forgejo account the gitea_token secret belongs to. It said
      # dominikludwig1995 - the commit author and old GitHub name - which is
      # no Forgejo user at all, so every login failed with "error
      # authenticating" and main went red on the docker step.
      username: dominik
      password:
        from_secret: gitea_token
      platforms: linux/amd64,linux/arm64
      tags:
        - ${CI_COMMIT_TAG:-latest}
      build_args:
        SERVER_URL: https://api.infra-heroes.de
        AUTH_DOMAIN: auth.infra-heroes.de
        CLIENT_ID: from_secret:client_id
