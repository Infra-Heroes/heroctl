# The Codeberg pipeline (ci.codeberg.org). Codeberg receives every commit and
# tag through Forgejo's push mirror; this publishes heroctl there as well:
# binaries on Codeberg releases, the image on Codeberg's registry.
#
# Nothing here runs on ci.infra-heroes.de - pipeline.yml is that side. Needs,
# on Codeberg CI: the repository activated, and the secrets codeberg_token
# (write:package, write:repository) and client_id.
when:
  - event: [push, tag, manual]
    evaluate: 'CI_FORGE_URL contains "codeberg.org"'

steps:
  test:
    image: golang:1.26-alpine
    commands:
      - apk add --no-cache git build-base
      - go test ./...

  build:
    image: golang:1.26-alpine
    environment:
      CLIENT_ID:
        from_secret: client_id
    commands:
      - apk add --no-cache git
      - |
        if [ "${CI_PIPELINE_EVENT}" = "tag" ] && [ -z "$${CLIENT_ID}" ]; then
          echo "CLIENT_ID is not set: a released binary would be unable to sign in." >&2
          exit 1
        fi
      - |
        LDFLAGS="-s -w -X github.com/Infra-Heroes/heroctl/internal/build.ServerURL=https://api.infra-heroes.de -X github.com/Infra-Heroes/heroctl/internal/build.AuthDomain=auth.infra-heroes.de -X github.com/Infra-Heroes/heroctl/internal/build.ClientID=$${CLIENT_ID} -X github.com/Infra-Heroes/heroctl/internal/build.Version=${CI_COMMIT_TAG:-dev}"
        mkdir -p dist
        for os in linux darwin windows; do
          for arch in amd64 arm64; do
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            echo "Building heroctl-$os-$arch$ext..."
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="$LDFLAGS" -o dist/heroctl-$os-$arch$ext ./cmd/heroctl
          done
        done
    when:
      - event: [tag, manual]

  release:
    image: woodpeckerci/plugin-release
    when:
      - event: tag
        ref: refs/tags/v*
    settings:
      api_key:
        from_secret: codeberg_token
      files:
        - dist/*

  docker:
    image: woodpeckerci/plugin-docker-buildx:6.1.0
    when:
      - event: tag
        ref: refs/tags/v*
      - event: push
        branch: main
    settings:
      registry: codeberg.org
      repo: codeberg.org/infraheroes/heroctl
      username: dominikludwig1995
      password:
        from_secret: codeberg_token
      platforms: linux/amd64,linux/arm64
      tags:
        - ${CI_COMMIT_TAG:-latest}
      build_args:
        - SERVER_URL=https://api.infra-heroes.de
        - AUTH_DOMAIN=auth.infra-heroes.de
      build_args_from_env:
        - CLIENT_ID
    secrets: [ codeberg_token, client_id ]